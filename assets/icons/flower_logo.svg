<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>Flower app icon</title>
  <desc>Square app icon with warm cream background, 8 symmetrical blue petals and amber stamen center on a green stem</desc>

  <defs>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="400" height="400" rx="88"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="88" fill="#FFFAF2"/>

  <g clip-path="url(#iconClip)">

    <rect x="0" y="0" width="400" height="400" rx="88" fill="#FFFAF2"/>

    <line x1="200" y1="280" x2="200" y2="390" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>

    <g transform="translate(200 185)">
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1565C0" opacity="0.72"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1A6FD4" opacity="0.78" transform="rotate(45)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1565C0" opacity="0.72" transform="rotate(90)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1A6FD4" opacity="0.78" transform="rotate(135)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1565C0" opacity="0.72" transform="rotate(180)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1A6FD4" opacity="0.78" transform="rotate(225)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1565C0" opacity="0.72" transform="rotate(270)"/>
      <ellipse cx="0" cy="-72" rx="28" ry="66" fill="#1A6FD4" opacity="0.78" transform="rotate(315)"/>

      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(45)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(90)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(135)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(180)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(225)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(270)"/>
      <ellipse cx="0" cy="-68" rx="22" ry="58" fill="#1976D2" opacity="0.55" transform="rotate(315)"/>

      <circle cx="0" cy="0" r="30" fill="#BF360C"/>
      <circle cx="0" cy="0" r="22" fill="#E64A19"/>
      <circle cx="0" cy="0" r="14" fill="#FF8F00"/>

      <circle cx="0" cy="-11" r="4" fill="#FFD54F"/>
      <circle cx="-7" cy="-7" r="4" fill="#FFD54F"/>
      <circle cx="7" cy="-7" r="4" fill="#FFD54F"/>
      <circle cx="-10" cy="1" r="3.5" fill="#FFCC02"/>
      <circle cx="10" cy="1" r="3.5" fill="#FFCC02"/>
      <circle cx="-5" cy="8" r="3" fill="#FFB300"/>
      <circle cx="5" cy="8" r="3" fill="#FFB300"/>
    </g>

  </g>

  <rect x="0" y="0" width="400" height="400" rx="88" fill="none" stroke="#E8DCC8" stroke-width="1.5"/>

</svg>
